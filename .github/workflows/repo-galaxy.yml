name: Update Repo Galaxy

on:
  schedule:
    - cron: "0 0 * * *"   # daily, 00:00 UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    paths:
      - "scripts/**"
      - "elements.json"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          python scripts/generate_galaxy.py "$GH_USER" repo-galaxy.svg
          python scripts/generate_panels.py "$GH_USER"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo-galaxy.svg brightest-stars.svg elements.svg
          git diff --cached --quiet || git commit -m "chore: update repo galaxy"
          git push
